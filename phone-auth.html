<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LYRx Phone Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top, #2a1740 0%, #120d19 44%, #09070d 100%);
      color: #fff; padding: 24px;
    }
    .card {
      width: min(560px, 100%); padding: 34px; border-radius: 24px;
      background: rgba(25, 18, 35, .94); border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 24px 80px rgba(0,0,0,.42); text-align: center;
    }
    .mark {
      width: 66px; height: 66px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 20px; background: linear-gradient(135deg,#8d5cff,#c65cff);
      font-size: 29px; font-weight: 800; box-shadow: 0 14px 34px rgba(145,87,255,.30);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; color: #cfc7d8; line-height: 1.6; }
    .phone { color: #fff; font-weight: 700; font-size: 18px; margin-bottom: 20px; }
    #recaptcha-container { display: flex; justify-content: center; margin: 18px 0; min-height: 78px; }
    button {
      width: 100%; border: 0; border-radius: 13px; padding: 14px 18px;
      font-size: 15px; font-weight: 700; cursor: pointer; color: #fff;
      background: linear-gradient(135deg,#7d4dff,#b454ff);
    }
    button:disabled { opacity: .55; cursor: default; }
    .status { min-height: 48px; margin-top: 16px; color: #d7cfdf; font-size: 14px; }
    .small { font-size: 12px; color: #938a9f; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">L</div>
    <h1>LYRx Phone Verification</h1>
    <p>Complete Firebase's security check to request your verification code.</p>
    <div id="phone" class="phone"></div>
    <div id="recaptcha-container"></div>
    <button id="sendButton" type="button">Send OTP</button>
    <div id="status" class="status">Preparing secure verification…</div>
    <div class="small">After the request succeeds, this page will return you to the LYRx desktop app.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);
    const phone = params.get("phone") || "";
    const apiKey = params.get("apiKey") || "";
    const projectId = params.get("projectId") || "";
    const authDomain = params.get("authDomain") || "";
    const callback = params.get("callback") || "";
    const state = params.get("state") || "";

    const phoneEl = document.getElementById("phone");
    const statusEl = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");
    phoneEl.textContent = phone || "Phone number missing";

    function fail(message) {
      statusEl.textContent = message;
      sendButton.disabled = false;
    }

    if (!phone || !apiKey || !projectId || !authDomain || !callback || !state) {
      fail("The LYRx verification request is incomplete. Return to the app and try again.");
      sendButton.disabled = true;
    } else {
      try {
        const app = initializeApp({ apiKey, authDomain, projectId });
        const auth = getAuth(app);
        auth.useDeviceLanguage();

        const verifier = new RecaptchaVerifier(auth, "recaptcha-container", {
          size: "normal",
          callback: () => {
            statusEl.textContent = "Security check complete. Click Send OTP.";
          },
          "expired-callback": () => {
            statusEl.textContent = "Security check expired. Complete it again.";
          }
        });

        await verifier.render();
        statusEl.textContent = "Complete the reCAPTCHA, then click Send OTP.";

        sendButton.addEventListener("click", async () => {
          sendButton.disabled = true;
          statusEl.textContent = "Requesting OTP from Firebase…";

          try {
            const confirmation = await signInWithPhoneNumber(auth, phone, verifier);
            statusEl.textContent = "OTP requested. Returning to LYRx…";

            const target = new URL(callback);
            target.searchParams.set("state", state);
            target.searchParams.set("verification_id", confirmation.verificationId);
            window.location.replace(target.toString());
          } catch (error) {
            console.error(error);
            const message = error?.message || "Firebase phone verification failed.";
            fail(message);
            try { verifier.clear(); } catch (_) {}
          }
        });
      } catch (error) {
        console.error(error);
        fail(error?.message || "Could not initialize Firebase Phone Auth.");
      }
    }
  </script>
</body>
</html>
